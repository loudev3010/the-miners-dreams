plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Minecraft 1.20.1 ships Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    // gametests, not in the jar
    gametest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    // dev-only test world mod
    testworld {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    testworldImplementation.extendsFrom implementation
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
                minersdream_testworld {
                    source sourceSets.testworld
                }
            }
        }
        client {
            // -PtestWorld [-Pcreative]
            if (project.hasProperty('testWorld')) property 'minersdream.testWorld', 'true'
            if (project.hasProperty('creative')) property 'minersdream.testWorld.creative', 'true'
            // -Pshowcase: record frames for the gifs
            if (project.hasProperty('showcase')) {
                property 'minersdream.testWorld', 'true'
                property 'minersdream.testWorld.creative', 'true'
                property 'minersdream.showcase', 'true'
            }
        }
        server {
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// fresh world every test run
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range, loader_version_range: loader_version_range,
            forge_version_range: forge_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

// test world as a standalone jar
tasks.register('testWorldJar', Jar) {
    from sourceSets.testworld.output
    archiveBaseName = "minersdream_testworld-${minecraft_version}"
    archiveVersion = '1.0.0'
    finalizedBy 'reobfTestWorldJar'
}

reobf {
    testWorldJar {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
