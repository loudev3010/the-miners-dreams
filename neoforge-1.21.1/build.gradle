plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// gametests, not in the jar
sourceSets {
    gametest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

// fresh world every test run
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('../LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
